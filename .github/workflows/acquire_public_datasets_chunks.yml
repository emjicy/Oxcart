name: Acquire public DrawReviews datasets chunked

on:
  push:
    branches:
      - dataset-acquisition-20260923
    paths:
      - ".github/workflows/acquire_public_datasets_chunks.yml"

permissions:
  contents: read

jobs:
  mbdd_chunks:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split MBDD2025
        run: |
          mkdir -p out/MBDD2025.parts
          curl -L --fail --retry 3 "https://www.kaggle.com/api/v1/datasets/download/mennamahmoudd/mbdd2025-building-defects" -o out/MBDD2025.zip
          sha256sum out/MBDD2025.zip | tee out/MBDD2025.parts/SHA256.txt
          split -b 75M -d -a 2 out/MBDD2025.zip out/MBDD2025.parts/MBDD2025.zip.part-
          ls -lh out/MBDD2025.parts

      - name: Upload MBDD part 00
        uses: actions/upload-artifact@v4
        with:
          name: MBDD2025_part_00
          path: out/MBDD2025.parts/MBDD2025.zip.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

